function migrateLegacy(old){const out=fresh();const mapping={kitchen:['path','family-food'],succession:['path','family-own'],recovery:['quest','recovery'],education:['quest','education'],laptop:['quest','digital'],social:['quest','social'],'daily-rep':['quest','repeat-kitchen'],'daily-connect':['quest','repeat-connect']};for(const q of old.quests||[]){if(!q||!Array.isArray(q.steps))continue;let target=null;const m=mapping[q.id];if(m){target=m[0]==='path'?out.paths.flatMap(p=>p.stages).find(s=>s.id===m[1]):out.quests.find(s=>s.id===m[1])}else{target={id:uid(),type:q.kind==='daily'?'daily':q.category==='Connections'||q.category==='Mind'?'life':'side',domain:q.category==='Connections'?'Social':q.category==='Mind'?'Health':q.category==='Technology'?'Technology':'Business',title:q.title||'Imported quest',desc:q.description||'',tasks:q.steps.map(x=>x.text||String(x)).slice(0,40)};out.quests.push(target)}if(!target)continue;const length=Math.min(q.steps.length,target.tasks.length);for(let i=0;i<length;i++){if(q.steps[i]?.done){const key=`${target.id}:${i}`+(target.type==='daily'?':'+today():'');out.done[key]=true}}}

function upgradeHboPath(data){
 const existing=data?.paths?.find(p=>p.id==='software');
 if(!existing || (existing.name!=='Software Engineering' && existing.short!=='HBO → Developer'))return data;
 const updated=SEED_PATHS.find(p=>p.id==='software');
 const oldStages=existing.stages||[];
 const originalById=new Map(oldStages.map(s=>[s.id,s]));
 const completedText=new Map(oldStages.map(stage=>[stage.id,(stage.tasks||[]).filter((_,i)=>data.done[stage.id+':'+i])]));
 const refreshed=updated.stages.map(seed=>{
  const previous=originalById.get(seed.id);
  if(!previous)return clone(seed);
  const stage=clone(seed);
  // Carry over only exactly matching objectives, never transfer a check to a different task.
  return stage;
 });
 for(const stage of oldStages){
  if(!updated.stages.some(x=>x.id===stage.id))refreshed.push(stage);
 }
 for(const stage of oldStages){
  if(updated.stages.some(x=>x.id===stage.id)){
   for(let i=0;i<(stage.tasks||[]).length;i++)delete data.done[stage.id+':'+i];
  }
 }
 // Restore matches after clearing old index-based completion flags.
 for(const seed of refreshed){
  const old=originalById.get(seed.id);
  if(!old)continue;
  for(const taskText of completedText.get(seed.id)||[]){
   const j=seed.tasks.indexOf(taskText);if(j>=0)data.done[seed.id+':'+j]=true;
  }
 }
 existing.name=updated.name;existing.short=updated.short;existing.headline=updated.headline;existing.description=updated.description;existing.stages=refreshed;
 return data;
}

const bytesText=n=>{if(n<1024)return `${n} B`;if(n<1024*1024)return `${(n/1024).toFixed(1)} KB`;return `${(n/1024/1024).toFixed(1)} MB`};
function openSavedFileDB(){if(!('indexedDB' in window))return Promise.reject(new Error('This browser does not support saved files.'));if(fileDBPromise)return fileDBPromise;fileDBPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(FILE_DB_NAME,1);req.onupgradeneeded=()=>{const database=req.result;if(!database.objectStoreNames.contains('files'))database.createObjectStore('files',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open saved files.'));req.onblocked=()=>reject(new Error('Close other Quest tabs, then try again.'))});fileDBPromise.catch(()=>{fileDBPromise=null});return fileDBPromise}
function fileStoreRequest(mode,action,value){return openSavedFileDB().then(database=>new Promise((resolve,reject)=>{const tx=database.transaction('files',mode),store=tx.objectStore('files');let req,result;try{req=action==='getAll'?store.getAll():action==='put'?store.put(value):action==='delete'?store.delete(value):null;if(!req)throw new Error('Unknown file action.')}catch(error){reject(error);return}req.onsuccess=()=>{result=req.result};req.onerror=()=>reject(req.error||new Error('File request failed.'));tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error||new Error('Could not save this file.'));tx.onabort=()=>reject(tx.error||new Error('Could not save this file.'))}))}
async function loadSavedFiles(){state.filesReady=false;state.filesError='';try{state.savedFiles=(await fileStoreRequest('readonly','getAll')).sort((a,b)=>b.addedAt.localeCompare(a.addedAt));state.filesReady=true}catch(error){state.filesError=error.message||'Saved files are unavailable in this browser.';state.filesReady=true} }
function renderFiles(){const rows=state.savedFiles;return head('Your files','Saved files','Keep plans, invoices, contracts, and useful project documents close to your career quests.')+`<div class="file-intro">${icon('shield')}<div><strong>Private to this browser.</strong> Files stay on this device and are not uploaded to the website or included in your JSON quest backup. Download copies to move them to another device.</div></div><div class="section-title"><div><h2>Your saved documents</h2><p>${rows.length} of ${MAX_SAVED_COUNT} files · up to ${bytesText(MAX_SAVED_FILE)} each</p></div><button class="btn primary" data-add-files>${icon('plus')} Save files</button></div>${state.filesError?`<div class="message gold" role="alert"><strong>Files unavailable.</strong> ${esc(state.filesError)}</div>`:''}${!state.filesReady?'<div class="empty">Loading your saved files…</div>':rows.length?`<div class="saved-file-list">${rows.map(file=>`<article class="panel saved-file"><div class="file-icon">${icon('book')}</div><div class="saved-file-main"><div class="saved-file-name">${esc(file.name)}</div><div class="saved-file-meta">${esc(file.type||'File')} · ${bytesText(file.size)} · Added ${new Date(file.addedAt).toLocaleDateString()}</div></div><div class="saved-file-actions"><button class="btn small" data-download-file="${esc(file.id)}" aria-label="Download ${esc(file.name)}">${icon('download')}<span class="file-action-text">Download</span></button><button class="btn small danger" data-delete-file="${esc(file.id)}" aria-label="Delete ${esc(file.name)}">${icon('trash')}<span class="file-action-text">Delete</span></button></div></article>`).join('')}</div>`:`<div class="panel saved-files-empty empty"><strong>No saved files yet.</strong>Keep a copy of a quote, client brief, invoice, contract, or any file that helps with your income and career plans.<br><button class="btn primary" data-add-files>${icon('plus')} Choose files</button></div>`}<p class="file-storage-note">Files are stored by your browser for this website. Clearing website data or changing devices may remove them, so download important originals and keep separate backups. Each file can be up to ${bytesText(MAX_SAVED_FILE)}.</p><button class="btn ghost small" style="margin-top:18px" data-view="journal">${icon('left')} Back to journal</button>`}
async function addSavedFiles(list){const files=[...list];if(!files.length)return;const maxBytes=MAX_SAVED_FILE;const tooLarge=files.find(f=>f.size>maxBytes);if(tooLarge){notice(`${tooLarge.name} is larger than ${bytesText(maxBytes)}.`);return}try{const current=await fileStoreRequest('readonly','getAll');const total=current.reduce((sum,f)=>sum+f.size,0),incoming=files.reduce((sum,f)=>sum+f.size,0);if(current.length+files.length>MAX_SAVED_COUNT){notice(`You can save up to ${MAX_SAVED_COUNT} files.`);return}if(total+incoming>MAX_SAVED_TOTAL){notice('Saved files would exceed 200 MB. Download or remove some files first.');return}try{await navigator.storage?.persist?.()}catch(_){}for(const file of files){const record={id:uid(),name:String(file.name).replace(/[\/]/g,'_').slice(0,240),type:file.type||'application/octet-stream',size:file.size,lastModified:file.lastModified||0,addedAt:new Date().toISOString(),blob:file.slice(0,file.size,file.type||'application/octet-stream')};await fileStoreRequest('readwrite','put',record)}await loadSavedFiles();if(state.view==='files')render();notice(files.length===1?'File saved on this device.':`${files.length} files saved on this device.`)}catch(error){const message=error.message||'The browser could not save these files. Check available storage and try again.';await loadSavedFiles();state.filesError=message;if(state.view==='files')render();notice('Could not save the files. Check your browser storage.')}}
async function downloadSavedFile(id){try{const file=await fileStoreRequest('readonly','getAll').then(files=>files.find(x=>x.id===id));if(!file){notice('File not found.');return}const url=URL.createObjectURL(file.blob);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(error){notice(error.message||'Could not download this file.')}}
async function deleteSavedFile(id){const file=state.savedFiles.find(x=>x.id===id);if(!file||!confirm(`Delete “${file.name}” from this device? This cannot be undone.`))return;try{await fileStoreRequest('readwrite','delete',id);await loadSavedFiles();render();notice('File deleted from this device.')}catch(error){notice(error.message||'Could not delete this file.')}}
function notice(message){const r=$('#toastRoot');r.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(notice.timeout);notice.timeout=setTimeout(()=>r.innerHTML='',3200)}
function navigate(v,focus){state.view=v;state.openQuest=focus||null;if(v==='files')loadSavedFiles().then(()=>{if(state.view==='files')render()});render();window.scrollTo({top:0,behavior:'auto'});if(focus)requestAnimationFrame(()=>{(focus==='routes'?$('#routes'):document.getElementById('quest-'+focus))?.scrollIntoView({behavior:'smooth',block:'start'})})}
function toggleTask(id,idx,checked){const q=findQuest(id)||findStage(id);if(!$('#modalRoot').children.length)state.openQuest=id;if(!q||!Number.isInteger(idx)||idx<0||idx>=q.tasks.length)return;const key=taskKey(q,idx);if(checked)db.done[key]=true;else delete db.done[key];if(checked)db.log.push({when:new Date().toISOString(),title:q.title,text:q.tasks[idx]});save();const preserved=state.openQuest;render();if(preserved)state.openQuest=preserved;if(checked&&completed(q))notice(isDaily(q)?'Daily quest complete!':'Quest complete! +60 bonus XP');}
function choose(id){const p=db.paths.find(x=>x.id===id);if(!p||id===db.chosen)return;if(!confirm(`Make “${p.name}” your selected main quest? All progress on other paths stays saved.`))return;db.chosen=id;save();state.openQuest=null;navigate('path');notice('Main storyline changed. Your progress is safe.')}
function pause(id){db.paused[id]=!db.paused[id];save();render();notice(db.paused[id]?'Quest paused. Progress saved.':'Quest resumed.')}
function moveStage(id,dir){for(const p of db.paths){const index=p.stages.findIndex(x=>x.id===id);if(index<0)continue;const to=index+dir;if(to<0||to>=p.stages.length)return;[p.stages[index],p.stages[to]]=[p.stages[to],p.stages[index]];save();render();return}}
function formModal(obj=null,mode='quest',opt={}){const stage=mode==='stage';const kind=stage?'stage':obj?.type||opt.type||'side';const whichPath=stage?(db.paths.find(p=>p.stages.includes(obj))?.id||opt.path||db.chosen):db.chosen;const defaultTasks=obj?.tasks?.join('\n')||'';$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modTitle"><div class="modal-title"><h2 id="modTitle">${obj?'Edit':'Create'} ${stage?'quest chapter':'quest'}</h2><button class="icon-btn" id="closeModal" aria-label="Close">${icon('close')}</button></div><p>Write something you can actually complete in real life.</p><form id="questForm"><div class="field"><label for="qt">Quest name</label><input id="qt" required maxlength="110" value="${esc(obj?.title||'')}" placeholder="e.g. Master the wok station"></div>${stage?`<div class="field"><label for="qpath">Main storyline</label><select id="qpath">${db.paths.map(p=>`<option value="${esc(p.id)}" ${whichPath===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`:`<div class="form-grid"><div class="field"><label for="qtype">Quest category</label><select id="qtype"><option value="side" ${kind==='side'?'selected':''}>Optional side quest</option><option value="life" ${kind==='life'?'selected':''}>Parallel life quest</option><option value="daily" ${kind==='daily'?'selected':''}>Repeatable daily quest</option></select></div><div class="field"><label for="qdomain">Life / skill area</label><input id="qdomain" maxlength="35" value="${esc(obj?.domain||'')}" placeholder="e.g. Social, Technology"></div></div>`}<div class="field"><label for="qd">Description</label><textarea id="qd" maxlength="900" style="min-height:85px" placeholder="Why this quest matters">${esc(obj?.desc||'')}</textarea></div><div class="field"><label for="qsteps">Objectives (one per line)</label><textarea id="qsteps" required maxlength="4500" placeholder="First step\nSecond step\nThird step">${esc(defaultTasks)}</textarea><small>Use concrete, observable steps. Existing checked objectives are kept when their wording stays the same.</small></div><div class="modal-actions"><button class="btn" type="button" id="cancelModal">Cancel</button>${obj?`<button class="btn danger" type="button" id="deleteItem" data-delete-modal="${esc(obj.id)}">${icon('trash')} Delete</button>`:''}<button class="btn primary" type="submit">${obj?'Save changes':'Create quest'}</button></div></form></section></div>`;$('#qt').focus();$('#questForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#qt').value.trim(),desc=$('#qd').value.trim(),tasks=$('#qsteps').value.split('\n').map(t=>t.trim()).filter(Boolean).slice(0,35);if(!title||!tasks.length){notice('Add a title and at least one objective.');return}let target=obj;if(!target){target={id:uid(),title,desc,tasks};if(stage){db.paths.find(p=>p.id===$('#qpath').value).stages.push(target)}else{target.type=$('#qtype').value;target.domain=$('#qdomain').value.trim()||'General';db.quests.push(target)}}else{const prev=target.tasks.slice(),prevDone=prev.map((_,i)=>done(target,i));const oldDaily=target.type==='daily';const nextDaily=!stage&&$('#qtype').value==='daily';for(let i=0;i<prev.length;i++)delete db.done[taskKey(target,i)];target.title=title;target.desc=desc;target.tasks=tasks;if(!stage){target.type=$('#qtype').value;target.domain=$('#qdomain').value.trim()||'General'}for(let i=0;i<tasks.length;i++){const j=prev.findIndex((x,idx)=>x===tasks[i]&&prevDone[idx]);if(j>=0){db.done[taskKey(target,i)]=true;prevDone[j]=false}}if(stage){const other=db.paths.find(p=>p.stages.includes(target));const selected=db.paths.find(p=>p.id===$('#qpath').value);if(other&&selected&&other!==selected){other.stages=other.stages.filter(s=>s.id!==target.id);selected.stages.push(target)}}}
save();$('#modalRoot').innerHTML='';render();notice(obj?'Quest updated.':'New quest created.');});$('#closeModal').onclick=$('#cancelModal').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};const del=$('#deleteItem');if(del)del.onclick=()=>removeItem(obj.id)}
function closeModal(){$('#modalRoot').innerHTML=''}
function removeItem(id){const q=findQuest(id)||findStage(id);if(!q)return;if(!confirm(`Delete “${q.title}”? Its progress will be removed. This cannot be undone.`))return;db.quests=db.quests.filter(x=>x.id!==id);for(const p of db.paths)p.stages=p.stages.filter(s=>s.id!==id);for(const key of Object.keys(db.done)){if(key.startsWith(id+':'))delete db.done[key]}delete db.paused[id];closeModal();save();render();notice('Quest deleted.')}
function settingsModal(){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="modal-title"><h2 id="settingsTitle">Backups & settings</h2><button id="closeModal" class="icon-btn" aria-label="Close">${icon('close')}</button></div><p>Your journal saves on this browser, not on a server. Make a backup before moving devices.</p><div class="toolbar-row"><button class="btn primary" data-export>${icon('download')} Export JSON</button><button class="btn" data-import>${icon('book')} Import backup</button><button class="btn danger" data-reset>${icon('trash')} Reset campaign</button></div><div class="message" style="margin-top:23px"><strong>iPhone tip:</strong> For reliable use, host this website, open it in Safari and add it to your Home Screen. Backups are especially important because Safari storage may be cleared.</div></section></div>`;$('#closeModal').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()}}
function exportData(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='open-world-quests-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notice('Backup downloaded. Keep it somewhere safe.')}
function importFile(file){if(!file)return;if(file.size>2_000_000){notice('Backup is too large.');return}const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(String(reader.result));const imported=validDB(raw)?raw:(raw&&raw.version!==2&&Array.isArray(raw.quests)?migrateLegacy(raw):null);if(!imported||!validDB(imported))throw Error('This is not a valid quest journal backup.');if(!confirm('Replace all current quest progress with this backup? Export your current progress first if needed.'))return;db=upgradeIncome(upgradeHboPath(imported));db.log=db.log||[];db.paused=db.paused||{};save();closeModal();navigate('income');notice('Campaign restored.')}catch(e){alert('Import failed: '+e.message)}};reader.readAsText(file)}
function resetAll(){if(!confirm('Reset the entire campaign? This removes all your progress and custom quests.'))return;if(!confirm('Final confirmation: erase everything and restore the starter quests?'))return;db=fresh();save();closeModal();navigate('income');notice('Campaign reset.')}
function openLife(id){const q=findQuest(id);if(!q)return;const view=state.view;const outer=$('#modalRoot');outer.innerHTML=`<div class="modal-backdrop" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="lifeTitle"><div class="modal-title"><h2 id="lifeTitle">${esc(q.title)}</h2><button class="icon-btn" id="closeModal" aria-label="Close">${icon('close')}</button></div><p>${esc(q.desc)}</p><div class="bar teal" style="margin:19px 0 9px"><span style="width:${pct(q)}%"></span></div><p class="hint" style="margin-bottom:14px">${numDone(q)} of ${q.tasks.length} objectives complete</p><div class="tasks">${taskHTML(q)}</div><div class="toolbar-row"><button class="btn" data-edit-quest="${esc(q.id)}">${icon('edit')} Edit quest</button><button class="btn" id="doneLife">Close</button></div></section></div>`;$('#closeModal').onclick=$('#doneLife').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()}}
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){navigate(b.dataset.view,b.dataset.focus);return}if(b.dataset.choose){choose(b.dataset.choose);return}if(b.dataset.newStage){formModal(null,'stage',{path:b.dataset.newStage});return}if(b.dataset.newType){formModal(null,'quest',{type:b.dataset.newType});return}if(b.dataset.openLife){openLife(b.dataset.openLife);return}if(b.dataset.editStage){formModal(findStage(b.dataset.editStage),'stage');return}if(b.dataset.editQuest){formModal(findQuest(b.dataset.editQuest));return}if(b.dataset.pause){pause(b.dataset.pause);return}if(b.dataset.move){moveStage(b.dataset.move,Number(b.dataset.dir));return}if(b.hasAttribute('data-export')){exportData();return}if(b.hasAttribute('data-import')){$('#importInput').click();return}if(b.hasAttribute('data-reset')){resetAll();return}if(b.hasAttribute('data-add-files')){$('#savedFileInput').click();return}if(b.dataset.downloadFile){downloadSavedFile(b.dataset.downloadFile);return}if(b.dataset.deleteFile){deleteSavedFile(b.dataset.deleteFile);return}if(b.hasAttribute('data-new-income')){incomeModal();return}if(b.dataset.editIncome){incomeModal(db.opportunities.find(o=>o.id===b.dataset.editIncome));return}if(b.id==='newBtn'&&state.view==='files'){$('#savedFileInput').click();return}if(b.id==='newBtn'&&state.view==='income'){incomeModal();return}if(b.id==='newBtn'){formModal(null,'quest',{type:'side'});return}if(b.id==='settingsBtn'){settingsModal();return}});
document.body.addEventListener('change',e=>{if(e.target.id==='savedFileInput'){addSavedFiles(e.target.files);e.target.value='';return}if(e.target.id==='incomeSort'){state.incomeSort=e.target.value;render();$('#incomeSort').focus();return}if(e.target.matches('input[data-task]')){const id=e.target.dataset.task,idx=Number(e.target.dataset.idx);const modalActive=!!e.target.closest('#modalRoot');toggleTask(id,idx,e.target.checked);if(modalActive)openLife(id)}if(e.target.id==='importInput'){importFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
})();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
